name: Compiler APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: |
          mkdir -p project
          unzip -q EntrepriseSeydouAbdou_Application_Complete_v1.1.zip -d project

      - name: Vérifier le projet
        run: |
          ls -la project
          ls -la project/EntrepriseSeydouAbdou_Pro

      - name: Compiler l'APK
        run: |
          cd project/EntrepriseSeydouAbdou_Pro
          gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: EntrepriseSeydouAbdou-debug
          path: project/EntrepriseSeydouAbdou_Pro/app/build/outputs/apk/debug/app-debug.apk
