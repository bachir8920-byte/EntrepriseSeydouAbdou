name: Compiler APK Android
on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    name: Construire l'application
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        shell: bash
        run: |
          set -e
          mkdir -p project
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouve dans le depot."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Compiler l'APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find project -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : fichier settings.gradle introuvable."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: EntrepriseSeydouAbdou-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
